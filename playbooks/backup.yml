---
- name: Backup router configurations
  hosts: routers
  gather_facts: false

  tasks:
    - name: Read running configuration
      ansible.builtin.command: vtysh -c "show running-config"
      register: running_config
      changed_when: false

    - name: Save configuration on control node
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../backups/{{ inventory_hostname }}.conf"
        content: "{{ running_config.stdout }}\n"
        mode: "0644"
      delegate_to: localhost
      become: false